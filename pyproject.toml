[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panoptic-prelabel"
dynamic = ["version"]
description = "Panoptic pre-annotation: Mask R-CNN things + MobileSAM stuff, CVAT correction, deterministic resolve."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Julien Delclos" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
# Core: everything resolve / export-web / tests need. No deep-learning framework.
# Ranges here; the exact versions everything was run with are in constraints.txt.
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pillow>=10.1",
  "pyyaml>=6.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
# The two models, CPU inference. Only `prelabel` (and `run`) need these.
models = [
  "onnxruntime>=1.17",
  "torch>=2.2",
  "torchvision>=0.17",
  "timm>=0.9",
  # MobileSAM is not on PyPI: pinned to the commit the weights come from
  "mobile_sam @ git+https://github.com/ChaoningZhang/MobileSAM.git@f706ad9c4eb7f219c00d9050e46328518ffb65d2",
]
dev = [
  "pytest>=8",
  "ruff>=0.15",
  "mypy>=1.15",
  "types-PyYAML",
]

[project.scripts]
panoptic-prelabel = "panoptic_prelabel.cli:main"

[project.urls]
Homepage = "https://juliendelclos.com"

[tool.setuptools.dynamic]
version = { attr = "panoptic_prelabel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
panoptic_prelabel = ["configs/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "NPY", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]
